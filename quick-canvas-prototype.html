<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Canvas</title>
<style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui;background:#202124;color:#eae9ee;overflow:hidden}header{height:104px;background:#28292d;border-bottom:1px solid #44454c;padding:13px 20px;position:relative;z-index:2}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.brand{font-size:17px;font-weight:650;margin-right:9px}.pill{font-size:10px;letter-spacing:1.4px;color:#b5a5f6;background:#423656;padding:4px 7px;border-radius:5px}.muted{color:#96969f}.right{margin-left:auto}.toolbar{display:flex;align-items:center;gap:5px}button{font:inherit;background:transparent;color:#c9c9d1;border:1px solid transparent;border-radius:7px;padding:8px 10px;cursor:pointer;white-space:nowrap}button:disabled{opacity:.3;cursor:default}button:hover{background:#3c3d44}button.active{background:#51416e;border-color:#9d80db;color:white}.sep{height:25px;width:1px;background:#45454f;margin:0 8px}.swatch{width:25px;height:25px;padding:0;border-radius:50%;border:3px solid #28292d;outline:1px solid transparent}.swatch.active{outline:2px solid #cbc3e7;background:var(--c)}input[type=color]{width:28px;height:28px;border:0;background:none;padding:0;cursor:pointer}select{background:#34353b;color:white;border:1px solid #555;border-radius:5px;padding:6px}#board{display:block;touch-action:none;cursor:crosshair}footer{position:fixed;bottom:0;left:0;right:0;height:31px;background:#28292dee;border-top:1px solid #44454c;display:flex;align-items:center;padding:0 16px;gap:18px;font-size:11px;color:#aaaab5;pointer-events:none}#hint{position:absolute;top:145px;left:38px;pointer-events:none;color:#6e707e;font-size:14px;line-height:1.8}#hint strong{font-size:26px;font-weight:450;color:#a9aab6}textarea{position:absolute;z-index:3;min-width:240px;min-height:80px;background:#24252af2;border:1px solid #ad8bef;border-radius:4px;outline:none;padding:6px;color:white;font:22px system-ui;resize:both}#zoom{pointer-events:auto}#zoom button{padding:2px 8px}#notice{color:#d7bcf5}.toolbar{overflow-x:auto}button:focus-visible{outline:2px solid #c0a1ff}

header{height:56px;padding:8px 12px;display:flex;align-items:center;gap:12px}.brand{font-size:16px;margin:0;flex-shrink:0}.brand span{font-weight:400;color:#a5a0b2}.toolbar{gap:4px;flex:1;padding:3px;min-width:0;scrollbar-width:thin}.toolbar>*{flex-shrink:0}button{padding:7px 9px}.sep{margin:0 5px}.history{display:flex}.swatch{width:23px;height:23px}select{max-width:105px;height:32px}select.active{border-color:#b995f8;background:#51416e}#hint{top:96px}#board.dragging{outline:2px dashed #b995f8;outline-offset:-9px}footer{gap:12px}.tips{margin-left:auto}@media(max-width:850px){.brand{display:none}.tips{display:none}header{gap:5px;padding:8px 6px}footer{padding:0 8px}}input[type=file]{display:none}

body{color-scheme:dark}body.light{color-scheme:light;background:#fafafa;color:#252530}body.light header{background:#f1f2f5;border-color:#d9dbe3}body.light button{color:#414351}body.light button:hover{background:#e2e4ec}body.light button.active,body.light select.active{background:#e7def8;color:#51327d;border-color:#9871c7}body.light .brand span,body.light .muted{color:#6d6c7a}body.light .sep{background:#d4d6df}body.light .swatch{border-color:#f1f2f5}body.light .swatch.active{outline-color:#7851ad}body.light select{background:#fff;color:#30313c;border-color:#cdd0db}body.light footer{background:#f1f2f5ed;border-color:#d9dbe3;color:#606170}body.light #notice{color:#74509d}body.light #hint{color:#858591}body.light #hint strong{color:#606170}body.light textarea{background:#fffffff5;border-color:#9871c7}body.light #fontControl{color:#414351!important}body.light #fontSize{background:#fff!important;color:#30313c!important;border-color:#cdd0db!important}#theme{min-width:66px}body.light button:focus-visible{outline-color:#7851ad}
</style>
<header><span class="brand" title="Quick Canvas · nothing saved">QC<span>anvas</span></span><div class="toolbar" id="tools"></div><div class="history"><button id="theme" title="Switch to light mode" aria-label="Switch to light mode">☀ Light</button><button id="duplicate" title="Duplicate selection (⌘/Ctrl D)" aria-label="Duplicate selection" disabled>Duplicate</butt</button>on><button id="undo" title="Undo (⌘/Ctrl Z)" aria-label="Undo">↶</button><button id="redo" title="Redo (⌘/Ctrl Shift Z)" aria-label="Redo">↷</button></div></header>
<canvas id="board"></canvas><div id="hint"><strong>Make space for an idea.</strong><br>Draw, type, or drop a screenshot here.<br><span style="font-size:12px">Space + drag to move around · Ctrl/⌘ + wheel to zoom</span></div>
<footer><span id="status">Pen</span><span id="notice">Ready</span><span class="tips">Ctrl/⌘ A: select all · Ctrl/⌘ D: duplicate · Shift: stretch images</span><span id="zoom"><button id="minus">−</button><span id="pct">100%</span><button id="plus">+</button><button id="home">Reset view</button></span></footer>
<script>
'use strict';
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d',{desynchronized:true}),bar=document.querySelector('#tools');
let objects=[],undo=[],redo=[],tool='Pen',color='#eeeaf5',width=3,zoom=1,pan={x:0,y:0},gesture=null,selected=null,space=false,editor=null,nextId=1;
let lightMode=false;
let fontSize=22;
let groupSelection=new Set();
function selection(){return objects.filter(o=>o.id===selected||groupSelection.has(o.id))}
const palette=['#eeeaf5','#252530','#e5ae57','#6198ff','#60c79b','#f16f7a','#b995f8','#edcf61'];
const tools=[['Select','↖'],['Lasso','◌'],['Pen','Pen'],['Highlighter','Marker'],['Eraser','Eraser'],['Text','T'],['Insert space','↕'],['Hand','Pan']];
function chooseTool(t){finishText();tool=t;selected=null;groupSelection.clear();sync();draw()}
for(const [t,label] of tools){let b=document.createElement('button');b.textContent=label;b.title=t;b.setAttribute('aria-label',t);b.dataset.tool=t;b.onclick=()=>chooseTool(t);bar.append(b)}
bar.insertAdjacentHTML('beforeend','<select id="shapes" title="Shapes" aria-label="Shapes"><option value="" disabled selected>Shapes</option><option value="Line">╱ Line</option><option value="Arrow">↗ Arrow</option><option value="Rectangle">□ Rectangle</option><option value="Ellipse">○ Ellipse</option></select><button id="imageButton" title="Insert screenshot or image · you can also drop or paste" aria-label="Insert image">Image +</button><input id="imageFiles" type="file" accept="image/*" multiple>');
document.querySelector('#shapes').onchange=e=>chooseTool(e.target.value);
document.querySelector('#imageButton').onclick=()=>document.querySelector('#imageFiles').click();
document.querySelector('#imageFiles').onchange=e=>{finishText();[...e.target.files].forEach((f,i)=>addImage(f,world({x:80+i*24,y:80+i*24})));e.target.value=''};
bar.insertAdjacentHTML('beforeend','<span class="sep"></span>');
for(const c of palette){let b=document.createElement('button');b.className='swatch';b.style.setProperty('--c',c);b.style.background=c;b.title=c;b.dataset.color=c;b.onclick=()=>applyColor(c);bar.append(b)}
bar.insertAdjacentHTML('beforeend','<input type="color" id="custom" title="Custom ink colour" value="#b995f8"><span class="sep"></span><select id="size" title="Pen width"><option value="1.5">Fine</option><option value="3" selected>Medium</option><option value="6">Bold</option><option value="10">Thick</option></select>');
bar.insertAdjacentHTML('beforeend','<label id="fontControl" title="Text size in pixels" style="display:none;align-items:center;gap:5px;color:#c9c9d1">Aa <input id="fontSize" type="number" min="8" max="160" step="1" value="22" aria-label="Font size" style="width:58px;height:32px;background:#34353b;color:white;border:1px solid #555;border-radius:5px;padding:5px"></label>');
const fontInput=document.querySelector('#fontSize');
fontInput.onchange=e=>applyFontSize(e.target.value);
fontInput.onblur=e=>{if(editor&&e.relatedTarget!==editor.el)finishText()};
function textMetrics(text,size){ctx.font=size+'px system-ui';return {w:Math.max(0,...text.split('\n').map(line=>ctx.measureText(line).width)),h:text.split('\n').length*lineHeight(size)}}
function lineHeight(size){return size*28/22}
function applyFontSize(value){const n=Number(value);if(!Number.isFinite(n)||n<8||n>160){fontInput.value=fontSize;return}fontSize=n;
 if(editor){editor.fontSize=n;editor.el.style.fontSize=(n*zoom)+'px';editor.el.style.lineHeight=(lineHeight(n)*zoom)+'px';editor.el.oninput()}
 else{const targets=selection().filter(o=>o.type==='Text'&&(o.fontSize||22)!==n);if(targets.length){checkpoint();targets.forEach(o=>Object.assign(o,{fontSize:n},textMetrics(o.text,n)));inkCache=null}}
 sync();draw();
}
document.querySelector('#custom').onchange=e=>applyColor(e.target.value);document.querySelector('#size').onchange=e=>width=+e.target.value;
function applyColor(value){
 color=value;
 const targets=selection().filter(o=>o.type!=='Image'&&o.color!==value);
 if(targets.length){checkpoint();targets.forEach(o=>o.color=value);inkCache=null;document.querySelector('#notice').textContent='Colour updated · ⌘/Ctrl Z to undo'}
 sync();draw();
}
function sync(){const textSelection=selection().filter(o=>o.type==='Text');document.querySelector('#fontControl').style.display=tool==='Text'||editor||textSelection.length?'inline-flex':'none';fontInput.value=editor?.fontSize??(textSelection.length?(textSelection[0].fontSize||22):fontSize);document.querySelector('#custom').value=color;let shapes=document.querySelector('#shapes'),isShape=['Line','Arrow','Rectangle','Ellipse'].includes(tool);shapes.value=isShape?tool:'';shapes.classList.toggle('active',isShape);document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('active',b.dataset.color===color));document.querySelector('#status').textContent=tool==='Eraser'?'Eraser · whole strokes':tool==='Insert space'?'Drag downward to add space':tool==='Lasso'?'Lasso · encircle or cross objects':tool;canvas.style.cursor=tool==='Hand'?'grab':tool==='Select'?'default':'crosshair'}
function clone(a){return a.map(o=>({...o,points:o.points?.map(p=>({...p}))}))}
function selectObjects(items){groupSelection=new Set(items.map(o=>o.id));selected=items.length===1?items[0].id:null;tool='Select';sync();draw()}
function selectAll(){finishText();selectObjects(objects);document.querySelector('#notice').textContent=objects.length+' objects selected'}
function duplicateSelection(){finishText();const originals=selection();if(!originals.length||gesture)return;checkpoint();const copies=clone(originals);copies.forEach(o=>{o.id=nextId++;move(o,24/zoom,24/zoom)});objects.push(...copies);inkCache=null;selectObjects(copies);document.querySelector('#notice').textContent=copies.length+' duplicated · ⌘/Ctrl Z to undo'}
document.querySelector('#duplicate').onclick=duplicateSelection;
function checkpoint(){undo.push(clone(objects));if(undo.length>60)undo.shift();redo=[]}
function history(back){finishText();let from=back?undo:redo,to=back?redo:undo;if(from.length){to.push(clone(objects));objects=from.pop();selected=null;groupSelection.clear();draw()}}
document.querySelector('#undo').onclick=()=>history(true);document.querySelector('#redo').onclick=()=>history(false);
function screen(p){return{x:p.x*zoom+pan.x,y:p.y*zoom+pan.y}}function world(p){return{x:(p.x-pan.x)/zoom,y:(p.y-pan.y)/zoom}}function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function bounds(o){if(o.points){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const p of o.points){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}return{x:minX,y:minY,w:maxX-minX,h:maxY-minY}}return{x:Math.min(o.x,o.x+o.w),y:Math.min(o.y,o.y+o.h),w:Math.abs(o.w),h:Math.abs(o.h)}}
function move(o,dx,dy){if(o.points)o.points.forEach(p=>{p.x+=dx;p.y+=dy});else{o.x+=dx;o.y+=dy}}
function corners(b){return [{x:b.x,y:b.y,sx:-1,sy:-1},{x:b.x+b.w,y:b.y,sx:1,sy:-1},{x:b.x,y:b.y+b.h,sx:-1,sy:1},{x:b.x+b.w,y:b.y+b.h,sx:1,sy:1}]}
function resizedBounds(g,p,keepRatio){let w=Math.max(12,(p.x-g.anchor.x)*g.corner.sx),h=Math.max(12,(p.y-g.anchor.y)*g.corner.sy);if(keepRatio){w=Math.max(w,h*g.ratio);h=w/g.ratio}return{x:g.anchor.x+(g.corner.sx<0?-w:0),y:g.anchor.y+(g.corner.sy<0?-h:0),w,h}}
function segment(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function hit(o,p,r=8/zoom){if(o.points)return o.points.length===1?Math.hypot(p.x-o.points[0].x,p.y-o.points[0].y)<r+o.width/2:o.points.slice(1).some((b,i)=>segment(p,o.points[i],b)<r+o.width/2);if(o.type==='Line'||o.type==='Arrow')return segment(p,{x:o.x,y:o.y},{x:o.x+o.w,y:o.y+o.h})<r+o.width/2;let b=bounds(o);return p.x>b.x-r&&p.x<b.x+b.w+r&&p.y>b.y-r&&p.y<b.y+b.h+r}
function paint(o){ctx.save();ctx.strokeStyle=o.color;ctx.fillStyle=o.color;ctx.lineWidth=o.width||2;ctx.lineCap='round';ctx.lineJoin='round';if(o.points){ctx.globalAlpha=o.type==='Highlighter'?.28:1;let p=o.points;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length-1;i++)ctx.quadraticCurveTo(p[i].x,p[i].y,(p[i].x+p[i+1].x)/2,(p[i].y+p[i+1].y)/2);if(p.length>1)ctx.lineTo(p.at(-1).x,p.at(-1).y);else{ctx.lineTo(p[0].x+.01,p[0].y)}ctx.stroke()}else if(o.type==='Image'){ctx.drawImage(o.image,o.x,o.y,o.w,o.h)}else if(o.type==='Text'){const size=o.fontSize||22;ctx.font=size+'px system-ui';ctx.textBaseline='top';o.text.split('\n').forEach((s,i)=>ctx.fillText(s,o.x,o.y+lineHeight(size)*i))}else{ctx.beginPath();if(o.type==='Rectangle')ctx.rect(o.x,o.y,o.w,o.h);else if(o.type==='Ellipse')ctx.ellipse(o.x+o.w/2,o.y+o.h/2,Math.abs(o.w/2),Math.abs(o.h/2),0,0,Math.PI*2);else{ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);if(o.type==='Arrow'){let a=Math.atan2(o.h,o.w),l=14+o.width;for(let d of [-.5,.5]){ctx.moveTo(o.x+o.w,o.y+o.h);ctx.lineTo(o.x+o.w-l*Math.cos(a+d),o.y+o.h-l*Math.sin(a+d))}}}ctx.stroke()}ctx.restore()}
let framePending=false,inkCache=null;
const backing=document.createElement('canvas');
function draw(){if(!framePending){framePending=true;requestAnimationFrame(()=>{framePending=false;renderNow()})}}
function renderNow(){let d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);let w=canvas.width/d,h=canvas.height/d;const active=gesture?.mode==='draw'?gesture:null;const cached=active&&inkCache===active&&backing.width===canvas.width&&backing.height===canvas.height;
if(cached){ctx.drawImage(backing,0,0,w,h);ctx.translate(pan.x,pan.y);ctx.scale(zoom,zoom)}else{
ctx.fillStyle=lightMode?'#fafafa':'#202124';ctx.fillRect(0,0,w,h);let grid=32*zoom;if(grid>=12){ctx.fillStyle=lightMode?'#dadce4':'#34363d';for(let x=((pan.x%grid)+grid)%grid;x<w;x+=grid)for(let y=((pan.y%grid)+grid)%grid;y<h;y+=grid)ctx.fillRect(x,y,1,1)}ctx.translate(pan.x,pan.y);ctx.scale(zoom,zoom);objects.forEach(o=>{if(o!==active?.o&&o!==editor?.existing)paint(o)});if(active){backing.width=canvas.width;backing.height=canvas.height;backing.getContext('2d').drawImage(canvas,0,0);inkCache=active}else{inkCache=null}}
if(active)paint(active.o);for(const o of selection()){let b=bounds(o);ctx.strokeStyle='#b995f8';ctx.lineWidth=1/zoom;ctx.setLineDash([4/zoom,4/zoom]);ctx.strokeRect(b.x-5/zoom,b.y-5/zoom,b.w+10/zoom,b.h+10/zoom);ctx.setLineDash([]);if(selection().length===1&&(o.type==='Image'||o.type==='Rectangle'||o.type==='Ellipse')){ctx.fillStyle='#b995f8';for(const c of corners(b))ctx.fillRect(c.x-5/zoom,c.y-5/zoom,10/zoom,10/zoom)}}if(gesture?.mode==='lasso'){const pts=gesture.points;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(const p of pts.slice(1))ctx.lineTo(p.x,p.y);ctx.closePath();ctx.fillStyle='#b995f81a';ctx.fill();ctx.strokeStyle='#b995f8';ctx.lineWidth=1.5/zoom;ctx.setLineDash([5/zoom,4/zoom]);ctx.stroke();ctx.setLineDash([])}if(gesture?.mode==='space'){ctx.strokeStyle='#b995f8';ctx.lineWidth=1/zoom;ctx.beginPath();ctx.moveTo(-pan.x/zoom,gesture.start.y);ctx.lineTo((w-pan.x)/zoom,gesture.start.y);ctx.stroke()}document.querySelector('#hint').style.display=objects.length||editor?'none':'block';document.querySelector('#pct').textContent=Math.round(zoom*100)+'%';document.querySelector('#undo').disabled=!undo.length;document.querySelector('#redo').disabled=!redo.length;document.querySelector('#duplicate').disabled=!selection().length||!!gesture}
function resize(){finishText();inkCache=null;let d=devicePixelRatio||1,h=Math.max(1,innerHeight-canvas.getBoundingClientRect().top-31);canvas.style.width=innerWidth+'px';canvas.style.height=h+'px';canvas.width=innerWidth*d;canvas.height=h*d;draw()}window.onresize=resize;
function startText(p,existing=null){
 fontSize=existing?.fontSize|| (existing?22:fontSize);const el=document.createElement('textarea'),s=screen(p),rect=canvas.getBoundingClientRect();
 el.setAttribute('aria-label','Canvas text');el.placeholder='Type here…';el.value=existing?.text||'';el.spellcheck=false;el.wrap='off';
 Object.assign(el.style,{left:(rect.left+s.x-7)+'px',top:(rect.top+s.y-7)+'px',fontSize:(fontSize*zoom)+'px',lineHeight:(lineHeight(fontSize)*zoom)+'px',color:existing?.color||color,width:Math.max(240,(existing?.w||240)*zoom+24)+'px'});
 document.body.append(el);editor={el,p,color:existing?.color||color,existing,fontSize};
 el.onblur=e=>{if(e.relatedTarget!==fontInput)finishText()};el.oninput=()=>{el.style.height='auto';el.style.height=Math.max(80,el.scrollHeight+2)+'px'};
 el.onkeydown=k=>{if(k.isComposing)return;if(k.key==='Escape'){k.preventDefault();finishText(false)}else if(k.key==='Enter'&&(k.metaKey||k.ctrlKey)){k.preventDefault();finishText()}};
 selected=null;groupSelection.clear();el.focus({preventScroll:true});el.setSelectionRange(el.value.length,el.value.length);el.oninput();sync();draw();
 document.querySelector('#notice').textContent='Type · click outside or ⌘/Ctrl Enter to finish · Esc to cancel';
}
function finishText(commit=true){if(!editor)return;const e=editor;editor=null;e.el.onblur=null;const text=e.el.value;
 if(commit&&(text!==(e.existing?.text||'')||(e.existing&&(e.existing.fontSize||22)!==e.fontSize))){checkpoint();if(e.existing)objects=objects.filter(o=>o.id!==e.existing.id);if(text.trim()){objects.push({id:e.existing?.id||nextId++,type:'Text',x:e.p.x,y:e.p.y,...textMetrics(text,e.fontSize),fontSize:e.fontSize,color:e.color,text})}}
 e.el.remove();document.querySelector('#notice').textContent='Ready';sync();draw();
}
canvas.ondblclick=e=>{if(tool!=='Select')return;const o=[...objects].reverse().find(o=>o.type==='Text'&&hit(o,world(point(e))));if(o){finishText();startText({x:o.x,y:o.y},o)}};
canvas.onpointerdown=e=>{if(e.button!==0&&e.button!==1)return;finishText();let s=point(e),p=world(s);if(space||tool==='Hand'||e.button===1){canvas.setPointerCapture(e.pointerId);gesture={mode:'pan',last:s};return}if(tool==='Text'){e.preventDefault();let existing=[...objects].reverse().find(o=>o.type==='Text'&&hit(o,p));startText(existing?{x:existing.x,y:existing.y}:p,existing);return}canvas.setPointerCapture(e.pointerId);if(tool==='Lasso'){selected=null;groupSelection.clear();gesture={mode:'lasso',points:[p]};draw();return}if(tool==='Select'){if(groupSelection.size>1&&selection().some(o=>hit(o,p))){gesture={mode:'groupMove',last:p,started:false};return}groupSelection.clear();let o=objects.find(o=>o.id===selected);if(o&&['Image','Rectangle','Ellipse'].includes(o.type)){let b=bounds(o),corner=corners(b).find(c=>Math.hypot(p.x-c.x,p.y-c.y)<14/zoom);if(corner){checkpoint();gesture={mode:'resize',o,ratio:b.w/b.h||1,corner,anchor:{x:corner.sx<0?b.x+b.w:b.x,y:corner.sy<0?b.y+b.h:b.y}};return}}o=[...objects].reverse().find(o=>hit(o,p));selected=o?.id;if(o){if(o.type!=='Image'){color=o.color;document.querySelector('#notice').textContent='Choose a colour to recolour this object'}checkpoint();gesture={mode:'move',o,last:p}}sync();draw();return}checkpoint();if(tool==='Insert space'){gesture={mode:'space',start:p,base:clone(objects)};return}if(tool==='Eraser'){gesture={mode:'erase',last:p};erase(p,p);return}let o={id:nextId++,type:tool,color,width:tool==='Highlighter'?width*5:width};if(tool==='Pen'||tool==='Highlighter')o.points=[p];else Object.assign(o,{x:p.x,y:p.y,w:0,h:0});objects.push(o);gesture={mode:'draw',o,start:p};draw()};
function erase(a,b){objects=objects.filter(o=>!o.points||!o.points.some((p,i)=>segment(p,a,b)<12/zoom+o.width/2||(i>0&&segment(a,o.points[i-1],p)<12/zoom+o.width/2)));draw()}
canvas.onpointermove=e=>{if(!gesture){if(tool==='Select'){let o=objects.find(o=>o.id===selected),c=o&&['Image','Rectangle','Ellipse'].includes(o.type)?corners(bounds(o)).find(c=>Math.hypot(world(point(e)).x-c.x,world(point(e)).y-c.y)<14/zoom):null;canvas.style.cursor=c?(c.sx===c.sy?'nwse-resize':'nesw-resize'):'default'}return;}let s=point(e),p=world(s),g=gesture;if(g.mode==='pan'){pan.x+=s.x-g.last.x;pan.y+=s.y-g.last.y;g.last=s}else if(g.mode==='lasso'){for(const ev of (e.getCoalescedEvents?.().length?e.getCoalescedEvents():[e])){const q=world(point(ev));if(Math.hypot(q.x-g.points.at(-1).x,q.y-g.points.at(-1).y)>1/zoom)g.points.push(q)}}else if(g.mode==='groupMove'){const dx=p.x-g.last.x,dy=p.y-g.last.y;if(dx||dy){if(!g.started){checkpoint();g.started=true}selection().forEach(o=>move(o,dx,dy));g.last=p}}else if(g.mode==='move'){move(g.o,p.x-g.last.x,p.y-g.last.y);g.last=p}else if(g.mode==='resize'){Object.assign(g.o,resizedBounds(g,p,g.o.type==='Image'?!e.shiftKey:e.shiftKey))}else if(g.mode==='space'){objects=clone(g.base);let dy=Math.max(0,p.y-g.start.y);objects.forEach(o=>{if(bounds(o).y>=g.start.y)move(o,0,dy)})}else if(g.mode==='erase'){erase(g.last,p);g.last=p}else if(g.o.points){for(let ev of (e.getCoalescedEvents?.().length?e.getCoalescedEvents():[e])){let q=world(point(ev));if(Math.hypot(q.x-g.o.points.at(-1).x,q.y-g.o.points.at(-1).y)>.3/zoom)g.o.points.push(q)}}else{g.o.w=p.x-g.start.x;g.o.h=p.y-g.start.y}draw()};
function insidePolygon(p,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[j],b=poly[i];if(segment(p,a,b)<1e-7)return true;if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)inside=!inside}return inside}
function segmentsCross(a,b,c,d){const cross=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);const abC=cross(a,b,c),abD=cross(a,b,d),cdA=cross(c,d,a),cdB=cross(c,d,b);return ((abC>0&&abD<0||abC<0&&abD>0)&&(cdA>0&&cdB<0||cdA<0&&cdB>0))||segment(a,c,d)<1e-7||segment(b,c,d)<1e-7||segment(c,a,b)<1e-7||segment(d,a,b)<1e-7}
function enclosed(o,poly){
 const b=bounds(o),closed=!o.points&&o.type!=='Line'&&o.type!=='Arrow';let pts;
 if(o.points)pts=o.points;
 else if(o.type==='Line'||o.type==='Arrow'){pts=[{x:o.x,y:o.y},{x:o.x+o.w,y:o.y+o.h}];if(o.type==='Arrow'){const a=Math.atan2(o.h,o.w),l=14+o.width,tip=pts[1];pts.push({x:tip.x-l*Math.cos(a-.5),y:tip.y-l*Math.sin(a-.5)},tip,{x:tip.x-l*Math.cos(a+.5),y:tip.y-l*Math.sin(a+.5)})}}
 else if(o.type==='Ellipse')pts=Array.from({length:64},(_,i)=>({x:b.x+b.w/2+Math.cos(i*Math.PI/32)*b.w/2,y:b.y+b.h/2+Math.sin(i*Math.PI/32)*b.h/2}));
 else pts=[{x:b.x,y:b.y},{x:b.x+b.w,y:b.y},{x:b.x+b.w,y:b.y+b.h},{x:b.x,y:b.y+b.h}];
 if(pts.some(p=>insidePolygon(p,poly))||(closed&&poly.some(p=>insidePolygon(p,pts))))return true;
 const tolerance=(o.width||0)/2;
 for(let i=0;i<pts.length-(closed?0:1);i++){const a=pts[i],b=pts[(i+1)%pts.length];for(let j=0;j<poly.length;j++){const c=poly[j],d=poly[(j+1)%poly.length];if(segmentsCross(a,b,c,d)||Math.min(segment(a,c,d),segment(b,c,d),segment(c,a,b),segment(d,a,b))<=tolerance)return true}}
 return pts.length===1&&poly.some((p,i)=>segment(pts[0],p,poly[(i+1)%poly.length])<=tolerance);
}
function end(e){if(gesture?.mode==='lasso'){const poly=gesture.points;if(e)poly.push(world(point(e)));if(poly.length>=3){groupSelection=new Set(objects.filter(o=>enclosed(o,poly)).map(o=>o.id));selected=groupSelection.size===1?[...groupSelection][0]:null;if(groupSelection.size)tool='Select';const first=selection().find(o=>o.type!=='Image');if(first)color=first.color;document.querySelector('#notice').textContent=groupSelection.size?groupSelection.size+' selected · drag to move · ⌘/Ctrl D to duplicate':'Nothing selected · draw a loop around or across objects'}sync()}gesture=null;draw()}canvas.onpointerup=end;canvas.onpointercancel=()=>{gesture=null;draw()};canvas.onlostpointercapture=()=>{gesture=null;draw()};
function zoomAt(f,s){finishText();inkCache=null;let p=world(s);zoom=Math.min(4,Math.max(.2,zoom*f));pan={x:s.x-p.x*zoom,y:s.y-p.y*zoom};draw()}
canvas.addEventListener('wheel',e=>{e.preventDefault();inkCache=null;if(editor)finishText();if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-e.deltaY*.008),point(e));else{pan.x-=e.deltaX;pan.y-=e.deltaY;draw()}},{passive:false});document.querySelector('#plus').onclick=()=>zoomAt(1.2,{x:innerWidth/2,y:innerHeight/2});document.querySelector('#minus').onclick=()=>zoomAt(1/1.2,{x:innerWidth/2,y:innerHeight/2});document.querySelector('#home').onclick=()=>{finishText();pan={x:0,y:0};zoom=1;draw()};
window.onkeydown=e=>{if(e.target.matches('textarea,input,select')||e.target.isContentEditable||e.isComposing)return;const key=e.key.toLowerCase();if((e.metaKey||e.ctrlKey)&&(key==='a'||key==='d')){e.preventDefault();if(!gesture){if(key==='a')selectAll();else duplicateSelection()}return}if(e.code==='Space'){e.preventDefault();space=true}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();history(!e.shiftKey)}if((e.key==='Backspace'||e.key==='Delete')&&selection().length){e.preventDefault();checkpoint();const ids=new Set(selection().map(o=>o.id));objects=objects.filter(o=>!ids.has(o.id));selected=null;groupSelection.clear();draw()}if(e.key==='Escape'){selected=null;groupSelection.clear();draw()}};window.onkeyup=e=>{if(e.code==='Space')space=false};window.onblur=()=>{space=false;gesture=null;draw()};
async function addImage(file,p){if(!file||(!file.type.startsWith('image/')&&!/\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(file.name||''))){document.querySelector('#notice').textContent='Please drop an image file';return}let url=URL.createObjectURL(file),im=new Image;im.onload=()=>{checkpoint();inkCache=null;let scale=Math.min(1,640/im.width);objects.push({id:nextId++,type:'Image',x:p.x,y:p.y,w:im.width*scale,h:im.height*scale,image:im});URL.revokeObjectURL(url);tool='Select';groupSelection.clear();selected=objects.at(-1).id;sync();draw();document.querySelector('#notice').textContent='Image added · drag to move, any corner to resize'};im.onerror=()=>{URL.revokeObjectURL(url);document.querySelector('#notice').textContent='Could not decode this image'};im.src=url}
canvas.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';canvas.classList.add('dragging')};canvas.ondragleave=()=>canvas.classList.remove('dragging');canvas.ondrop=e=>{e.preventDefault();finishText();canvas.classList.remove('dragging');let p=world(point(e));[...e.dataTransfer.files].forEach((f,i)=>addImage(f,{x:p.x+i*25,y:p.y+i*25}))};window.addEventListener('paste',e=>{if(editor)return;for(let it of e.clipboardData.items)if(it.type.startsWith('image/')){e.preventDefault();addImage(it.getAsFile(),world({x:innerWidth/2-200,y:160}))}});
function toggleTheme(){
 finishText();lightMode=!lightMode;document.body.classList.toggle('light',lightMode);inkCache=null;
 if(lightMode&&color==='#eeeaf5')color='#252530';else if(!lightMode&&color==='#252530')color='#eeeaf5';
 const button=document.querySelector('#theme');button.textContent=lightMode?'☾ Dark':'☀ Light';button.title=lightMode?'Switch to dark mode':'Switch to light mode';button.setAttribute('aria-label',button.title);
 sync();draw();
}
document.querySelector('#theme').onclick=toggleTheme;
sync();resize();
